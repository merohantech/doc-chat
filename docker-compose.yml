name: chat

x-backend: &backend
  build: ./backend
  env_file: ./backend/.env
  environment:
    DATABASE_URL: postgresql+asyncpg://chat:chat@postgres:5432/chat
    REDIS_URL: redis://redis:6379/0
    STORAGE_DIR: /srv/storage/uploads
  volumes:
    - uploads:/srv/storage/uploads

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      # 5433 on the host: avoids clashing with a locally installed Postgres.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies migrations, then exits. api/worker wait for it to succeed.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  ui:
    build: ./ui
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["arq", "app.workers.settings.WorkerSettings"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
